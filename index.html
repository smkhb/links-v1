<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuel Bernardo — links</title>
    <meta name="description" content="Links de Samuel Bernardo: GitHub, LinkedIn e contato." />
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/ia-writer-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'iA Writer Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/ia-writer-mono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'iA Writer Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/ia-writer-mono-700.woff2') format('woff2');
      }

      :root {
        --paper: #141414;
        --ink: #ececec;
        --soft: #a8a8a8;
        --line: #2c2c2c;
        --verde: #24d05a;
        --rosa: #eb4888;
        --azul: #10a2f5;
        --amarelo: #e9bc3f;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2.5rem 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font-family: 'iA Writer Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 26rem;
        margin: 0 auto;
      }

      .perfil {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .perfil img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--line);
      }

      h1 {
        margin: 1.1rem 0 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .cargo {
        margin: 0.15rem 0 0;
        font-size: 0.875rem;
        color: var(--soft);
      }

      nav {
        margin-top: 2rem;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }

      li + li {
        border-top: 1px solid var(--line);
      }

      a {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.95rem 0.25rem;
        color: inherit;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      .rotulo {
        font-weight: 700;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
        text-decoration-color: var(--ul, var(--soft));
        transition: text-decoration-color 0.15s ease;
      }

      li:nth-child(1) .rotulo {
        --ul: var(--verde);
      }
      li:nth-child(2) .rotulo {
        --ul: var(--rosa);
      }
      li:nth-child(3) .rotulo {
        --ul: var(--azul);
      }

      .destino {
        font-size: 0.75rem;
        color: var(--soft);
        white-space: nowrap;
      }

      a:active {
        background: #1c1c1c;
      }

      a:focus-visible {
        outline: 2px solid var(--azul);
        outline-offset: 2px;
        border-radius: 2px;
      }

      footer {
        margin-top: 2.5rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--soft);
      }

      footer a {
        display: inline;
        padding: 0;
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: var(--amarelo);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="perfil">
        <img src="/profile.jpg" alt="Foto de perfil de Samuel Bernardo" width="96" height="96" />
        <h1>Samuel Bernardo</h1>
        <p class="cargo">Software Developer</p>
      </header>

      <nav aria-label="Links">
        <ul>
          <li>
            <a href="https://github.com/smkhb" rel="me">
              <span class="rotulo">GitHub</span>
              <span class="destino">github.com/smkhb</span>
            </a>
          </li>
          <li>
            <a href="https://www.linkedin.com/in/smkhb" rel="me">
              <span class="rotulo">LinkedIn</span>
              <span class="destino">in/smkhb</span>
            </a>
          </li>
          <li>
            <a href="mailto:samuel.hagers.bernardo@gmail.com">
              <span class="rotulo">E-mail</span>
              <span class="destino">gmail.com</span>
            </a>
          </li>
        </ul>
      </nav>

      <footer>
        <p>© <span id="ano">2026</span> Samuel Bernardo · <a href="https://samb.fyi">portfólio</a></p>
      </footer>
    </main>

    <script>
      const cores = ['#24d05a', '#eb4888', '#10a2f5', '#e9bc3f'];
      const rotulos = document.querySelectorAll('.rotulo');
      const pintar = () => {
        const baralho = [...cores].sort(() => Math.random() - 0.5);
        rotulos.forEach((r, i) => (r.style.textDecorationColor = baralho[i % baralho.length]));
      };
      pintar();
      document.querySelectorAll('a').forEach((a) => a.addEventListener('mouseover', pintar));
      document.getElementById('ano').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
